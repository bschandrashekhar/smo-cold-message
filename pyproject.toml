[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "client-referencing"
version = "1.0.0"
description = "Prospect-to-client matching and reference data sync (clients, industries, case studies) via Excel"
requires-python = ">=3.10"
dependencies = [
    "voyageai>=0.3.0",
    "supabase>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["client_referencing*"]
